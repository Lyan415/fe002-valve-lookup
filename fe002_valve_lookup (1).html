function resolve(emTag,emState){
  if(!emState||emState==="N/A")return null;
  var isCond=typeof emState==="string"&&emState.indexOf("COND:")===0;
  if(isCond){
    var noteKey=emState.replace("COND:","");
    var phConds=conditions[curPhaseKey]||{};
    var rule=phConds[noteKey];
    if(rule)return[{comp:rule.em,val:"\u26A1 \u689D\u4EF6\u53C3\u7167",em:emTag,state:"\u4F9D "+rule.param,isCond:true,condKey:noteKey}];
    return[{comp:emTag,val:emState,em:emTag,state:emState,isCond:true}];
  }
  if(typeof emState==="string"&&emState.charAt(0)==="*")return[{comp:emTag,val:"\u26A1 "+emState,em:emTag,state:emState,isCond:true}];
  var emDef=cm[emTag];
  if(!emDef)return[{comp:emTag,val:emState,em:emTag,state:emState,isCond:false}];
  var sd=emDef.s[emState];
  if(!sd)return[{comp:emTag,val:"State: "+emState,em:emTag,state:emState,isCond:false}];
  return emDef.c.map(function(c,i){return{comp:c,val:sd[i],em:emTag,state:emState,isCond:false}});
}
function sColor(v){
  if(v===0||v==="0")return"#d6336c";
  if(v===1||v==="1")return"#00b894";
  if(typeof v==="string"){
    if(v.indexOf("\u26A1")>=0)return"#e17055";
    var u=v.toUpperCase();
    if(u==="PULSE"||u==="PWM"||u==="5D")return"#fdcb6e";
    if(u==="AUTO"||u==="CAS"||u==="MAN")return"#74b9ff";
    if(u==="OFF")return"#636e72";
    if(u==="C")return"#a29bfe";
    if(u==="ON"||u==="PROF"||u==="HOLD")return"#fd79a8";
  }
  return"#b2bec3";
}
function fmtVal(v){if(v===0||v==="0")return"\u95DC (0)";if(v===1||v==="1")return"\u958B (1)";return String(v)}

function expandState(emTag,stateName){
  var emDef=cm[emTag];
  if(!emDef)return null;
  var sd=emDef.s[stateName];
  if(!sd)return null;
  return emDef.c.map(function(c,i){return{comp:c,val:sd[i]}});
}

        var bg=(e.val===1||e.val==="1")?"background:#00b89418;":(e.val===0||e.val==="0")?"background:#d6336c18;":"";
        h+="<tr><td style='font-weight:600'>"+e.comp+"</td>";
        h+="<td><span class='val' style='"+bg+"border:1px solid "+c+"33;'><span class='dot' style='background:"+c+";"+glow+"'></span><span style='color:"+c+"'>"+fmtVal(e.val)+"</span></span></td></tr>";
      });
      h+="</tbody></table></div>";
    }else{
      h+="<div style='padding:10px 14px;color:#636e72;font-size:11px'>CM Table \u4E2D\u7121\u6B64 State \u5B9A\u7FA9</div>";
    }
    h+="</div>";
  });
  document.getElementById("modalBody").innerHTML=h;
  document.getElementById("modalOverlay").classList.add("show");
}
function closeModal(){document.getElementById("modalOverlay").classList.remove("show")}
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeModal()});

function render(){
  var info=document.getElementById("infoBar"),leg=document.getElementById("legend"),res=document.getElementById("results");
  if(!curStep){info.style.display="none";leg.style.display="none";res.innerHTML="<div class='empty'><div class='icon'>\u2699\uFE0F</div><p style='font-size:15px;margin-bottom:6px'>\u8ACB\u5148\u9078\u64C7 Phase \u548C Step</p><p style='font-size:12px'>\u9078\u64C7\u5F8C\u5373\u53EF\u67E5\u770B\u6240\u6709\u95A5\u4EF6/\u5143\u4EF6\u5728\u8A72\u6B65\u9A5F\u7684\u72C0\u614B</p><p style='font-size:11px;margin-top:14px;color:#4a5568'>"+Object.keys(phases).length+" \u500B Phase / "+Object.keys(cm).length+" \u500B EM</p></div>";return}
  var rows=[];var ems=curStep.ems;
  for(var emTag in ems){if(ems.hasOwnProperty(emTag)){var r=resolve(emTag,ems[emTag]);if(r)rows=rows.concat(r)}}
  rows.sort(function(a,b){return a.comp.localeCompare(b.comp)});
  var q=searchEl.value.toUpperCase().trim();
  if(q)rows=rows.filter(function(r){return r.comp.toUpperCase().indexOf(q)>=0||r.em.toUpperCase().indexOf(q)>=0});
  info.style.display="flex";leg.style.display="flex";
  info.innerHTML="<div><span>Phase: </span><b style='color:#00b894'>"+curPhaseKey+"</b></div><div><span>Step: </span><b style='color:#74b9ff'>S"+curStep.step+" - "+curStep.desc+"</b></div><div><span>\u5143\u4EF6\u6578: </span><b style='color:#a29bfe'>"+rows.length+"</b></div>";
  var h="<div class='tbl-wrap'><table><thead><tr><th style='width:180px'>EM (\u8A2D\u5099\u6A21\u7D44)</th><th style='width:130px'>EM State</th><th style='width:130px'>\u5143\u4EF6 Tag</th><th style='width:140px'>\u72C0\u614B</th></tr></thead><tbody>";
  if(!rows.length){h+="<tr><td colspan='4' style='text-align:center;padding:24px;color:#636e72;font-family:Noto Sans TC'>"+(q?"\u627E\u4E0D\u5230\u7B26\u5408\u7684\u5143\u4EF6":"\u7121\u8CC7\u6599")+"</td></tr>"}
  else{rows.forEach(function(r){
    var c=sColor(r.val),glow=(r.val===1||r.val==="1")?"box-shadow:0 0 5px #00b894;":"";
    var bg;
    if(r.isCond){bg="background:#e1705518;border:1px solid #e1705533;"}
    else if(r.val===1||r.val==="1"){bg="background:#00b89418;border:1px solid #00b89433;"}
    else if(r.val===0||r.val==="0"){bg="background:#d6336c18;border:1px solid #d6336c33;"}
    else{bg="border:1px solid "+c+"33;"}
    var clickCode="";
    if(r.isCond&&r.condKey)clickCode=" data-cond='"+r.condKey+"' class='cond-btn' title='\u9EDE\u64CA\u5C55\u958B\u5404\u689D\u4EF6\u4E0B\u7684\u5143\u4EF6\u72C0\u614B'";
    h+="<tr><td><span style='color:#b2bec3;font-size:11px'>"+r.em+"</span></td>";
    h+="<td><span class='tag'"+(r.isCond?" style='background:#e1705518;color:#e17055'":"")+ ">"+r.state+"</span></td>";
    h+="<td style='font-weight:600;color:#dfe6e9'>"+r.comp+"</td>";
    h+="<td><span class='val' style='"+bg+"'"+clickCode+"><span class='dot' style='background:"+c+";"+glow+"'></span><span style='color:"+c+"'>"+fmtVal(r.val)+"</span></span></td>";
    h+="</tr>";
  })}
  h+="</tbody></table></div>";res.innerHTML=h;
  res.querySelectorAll("[data-cond]").forEach(function(el){
    el.addEventListener("click",function(){showCondModal(this.getAttribute("data-cond"))});
  });
}
render();
</script>
</body></html>
